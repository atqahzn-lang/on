<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>So Meta (a case study) — Atiqah.is</title>

<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./report.css">
<link rel="stylesheet" href="./case-03.css">
<link rel="stylesheet" href="./case-04.css">
<link rel="stylesheet" href="./responsive.css">
<link rel="stylesheet" href="./catch-game.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../site-notice.css">
</head>

<body>

<aside class="portfolio-notice" aria-label="Portfolio status">
  <span class="portfolio-notice-dot" aria-hidden="true"></span>
  <span>Portfolio <strong>In progress</strong></span>
</aside>

<!-- ==========================================================
     13 — NINTENDO HTML
========================================================== -->

<main class="portfolio-page">

  <div class="page-caption">
    <strong>ATIQAH.IS</strong>
    <span>A portfolio experiment.</span>
  </div>

  <div class="game-layout">
  <div class="console">

    <div class="console-top">

      <div class="top-speakers">
        <div class="speaker"><i></i><i></i><i></i></div>
        <div class="speaker"><i></i><i></i><i></i></div>
      </div>

      <div class="top-screen-frame">
        <div class="top-screen">

          <div id="catch-arena" class="screen-state quest-screen catch-arena" tabindex="0" role="region" aria-label="Catch falling case files. Move with the left and right arrow keys, A and D, or the buttons below.">
            <div class="quest-hud"><span>CATCH THE CASES</span><span id="catch-counter">0 / 4 collected</span></div>
            <nav class="game-screen-tools" aria-label="Leave the game">
              <button id="skip-game" type="button">Skip</button>
              <button id="game-menu" type="button">Back to menu</button>
            </nav>
            <div id="falling-cases" aria-hidden="true"></div>
            <div class="cat-sprite catch-cat" id="catch-cat" aria-hidden="true"></div>
            <p class="arena-state" id="arena-state" hidden>PAUSED</p>
          </div>

        </div>
      </div>
    </div>

    <div class="console-hinge"></div>

    <div class="console-bottom">

      <div class="left-controls">
        <div class="circle-pad"></div>
        <div class="dpad">
          <button class="up" aria-label="Up">▲</button>
          <button class="left" aria-label="Left">◀</button>
          <button class="center" aria-label="Center">·</button>
          <button class="right" aria-label="Right">▶</button>
          <button class="down" aria-label="Down">▼</button>
        </div>
      </div>

      <div class="touchscreen-frame">
        <div class="touchscreen">

          <div class="touchscreen-header">
            <span>SO META</span>
            <span>ATIQAH.IS</span>
          </div>

          <div class="touchscreen-body">

            <div class="catch-controls">
              <h1 class="touch-heading">CATCH THE CASES</h1>
              <p class="catch-instruction" id="catch-instruction" role="status" aria-live="polite">Move the cat beneath a falling file.</p>
              <div class="movement-controls" aria-label="Move the cat">
                <button id="move-left" type="button" aria-label="Move left">←</button>
                <button id="move-right" type="button" aria-label="Move right">→</button>
              </div>
              <p class="collection-progress" id="collection-progress">0 of 4 cases collected</p>
              <button class="pause-control" id="pause-game" type="button" aria-pressed="false">Pause</button>
            </div>

          </div>

          <div class="touchscreen-footer">
            <span>CATCH · COLLECT · READ</span>
            <span>© ATIQAH.IS</span>
          </div>

        </div>
      </div>

      <div class="right-controls">
        <div class="abxy">
          <button class="x" aria-label="X">X</button>
          <button class="y" aria-label="Y">Y</button>
          <button class="a" id="button-a"
                  aria-label="A">A</button>
          <button class="b" id="button-b"
                  aria-label="B">B</button>
        </div>
      </div>

    </div>
  </div>
  <aside class="case-collection" aria-labelledby="collection-title">
    <h2 id="collection-title">YOUR CASES</h2>
    <p>Catch a file, then select it here to read.</p>
    <div id="collected-cases" class="collection-grid"></div>
  </aside>
  </div>
</main>

<script src="./cases.js" defer></script>
<script src="./case-03.js" defer></script>
<script src="./case-04.js" defer></script>
<script src="./report-template.js" defer></script>
<script src="./catch-engine.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
